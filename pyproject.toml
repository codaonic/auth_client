[project]
name = "auth-client"
version = "0.3.1"
description = "Token validation and FastAPI helpers for services behind Codaonic's AuthService (OAuth 2.1 / OIDC)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Codaonic" }]
keywords = ["oauth2", "oidc", "jwt", "auth", "mcp", "fastapi", "token-validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "joserfc>=1.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]

[project.urls]
Homepage = "https://github.com/codaonic/auth-client"
Repository = "https://github.com/codaonic/auth-client"
Issues = "https://github.com/codaonic/auth-client/issues"
Changelog = "https://github.com/codaonic/auth-client/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fastapi>=0.110",
    "cryptography>=42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
